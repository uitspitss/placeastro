name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: nci
      # storybook プロジェクトは Chromium 実機で走るのでバイナリを先に入れる
      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install --with-deps chromium
      - run: nr lint
      - run: nr typecheck
      - run: nr test
      - run: nr build
      # api の Worker は web のビルド成果物をアセットとして持つので、
      # assets.directory のずれなどの設定ミスをここで拾う
      - name: Deploy dry-run
        working-directory: apps/api
        run: nr deploy:dry-run
      - run: nr build-storybook
      - run: nr knip

  # ci とは独立させる。lint の失敗を待ってから E2E が動くとフィードバックが遅い。
  # D1 はローカル（miniflare）なので services コンテナは要らない
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: nci

      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install --with-deps chromium

      # ここで nr build しないのは、web のビルドを playwright の webServer が
      # VITE_API_URL を空にして行うため
      - name: Run E2E tests
        working-directory: apps/web
        run: nr test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # failure() だと flaky（retry で通った）ケースの trace が取れない
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # 別ワークフローに分けると needs が使えず workflow_run 越しになる。
  # 検証ステップを両方で二重に回すことになるのでここに同居させている
  deploy:
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: nci
      # api の Worker が web のビルド成果物（apps/web/dist）をアセットとして配る
      - run: nlx turbo run build --filter=@placeastro/web
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: deploy --env production

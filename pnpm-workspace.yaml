packages:
  - "apps/*"
  - "packages/*"

catalog:
  # playwright（Storybook の browser mode が使う）と @playwright/test（E2E ランナー）は
  # 必ず同じバージョンにする。ずれるとブラウザバイナリが2世代入り、
  # CI の `playwright install` がどちらを入れたか分からなくなる
  playwright: ^1.62.1
  "@playwright/test": ^1.62.1
  "@sentry/cloudflare": ^10.66.0
  "@sentry/hono": ^10.66.0
  hono: ^4.13.7
  tsx: ^4.23.9
  zod: ^4.0.0
  drizzle-orm: ^0.45.2
  react: ^19.0.0
  react-dom: ^19.0.0
  neverthrow: ^8.2.0

overrides:
  fast-xml-parser: ^5.8.0
  fast-xml-builder: ^1.2.0
  kysely: ^0.28.17
  lodash: ^4.18.1
